<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Fundraiser - ShareKind</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Background Image */
            background-image: url('sk pictures/back5.webp'); /* Replace with your image URL */
            background-size: cover; /* Ensures the image covers the entire background */
            background-position: center; /* Centers the image */
            background-repeat: no-repeat; /* Prevents the image from repeating */
        }

        .container {
            background: rgba(255, 255, 255, 0.9); /* Semi-transparent white background */
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h2 {
            color: #4a90e2;
            margin-bottom: 20px;
            font-size: 26px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Step Indicators */
        .step-indicators {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .step {
            width: 30px;
            height: 30px;
            margin: 0 10px;
            border-radius: 50%;
            border: 2px solid #ddd;
            line-height: 30px;
            text-align: center;
            color: #aaa;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .step.active {
            border-color: #4a90e2;
            color: #fff;
            background: #4a90e2;
            transform: scale(1.1);
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }

        .form-group label {
            display: block;
            color: #555;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.3);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Step Content */
        .step-content {
            display: none;
        }

        .step-content.active {
            display: block;
        }

        /* Navigation Buttons */
        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .nav-btns button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            color: white;
            background: #4a90e2;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .nav-btns button:hover {
            background: #357abd;
            transform: scale(1.05);
        }

        .nav-btns button.disabled {
            background: #ddd;
            cursor: not-allowed;
            transform: scale(1);
        }

        /* Thank You Message */
        .thank-you-message {
            display: none;
            text-align: center;
        }

        .thank-you-message.active {
            display: block;
        }

        .thank-you-message .icon {
            font-size: 50px;
            color: #4caf50;
            margin-bottom: 20px;
            animation: bounce 1.5s infinite;
        }

        .thank-you-message h3 {
            color: #4caf50;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .thank-you-message p {
            color: #555;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .thank-you-message button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            color: white;
            background: #4caf50;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .thank-you-message button:hover {
            background: #43a047;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Start Fundraiser</h2>

    <!-- Step Indicators -->
    <div class="step-indicators">
        <div class="step active" id="step1">1</div>
        <div class="step" id="step2">2</div>
        <div class="step" id="step3">3</div>
    </div>

    <!-- Step 1: Patient Information -->
    <div class="step-content active" id="step1-content">
        <div class="form-group">
            <label for="patientName">Full Name:</label>
            <input type="text" id="patientName" placeholder="Enter patient's full name" required>
        </div>
        <div class="form-group">
            <label for="issueType">What Issues? (Optional):</label>
            <select id="issueType">
                <option value="">Select an issue</option>
                <option value="Food">Food</option>
                <option value="Medicine">Medicine</option>
                <option value="Education">Education</option>
                <option value="Supervised Person (Disability)">Supervised Person (Disability)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="issueDescription">Description of Issues (Optional):</label>
            <textarea id="issueDescription" rows="3" placeholder="Describe the issue"></textarea>
        </div>
    </div>

    <!-- Step 2: Fundraiser Details -->
    <div class="step-content" id="step2-content">
        <div class="form-group">
            <label for="title">Fundraising Title:</label>
            <input type="text" id="title" placeholder="Enter fundraiser title" required>
        </div>
        <div class="form-group">
            <label for="goal">Goal Amount:</label>
            <input type="number" id="goal" placeholder="Enter goal amount" required>
        </div>
        <div class="form-group">
            <label for="days">How Many Days:</label>
            <input type="number" id="days" placeholder="Enter number of days" required>
        </div>
        <div class="form-group">
            <label for="image">Your Image:</label>
            <input type="file" id="image" accept="image/*" required>
        </div>
    </div>

    <!-- Step 3: Address and Documents -->
    <div class="step-content" id="step3-content">
        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" id="address" placeholder="Enter address" required>
        </div>
        <div class="form-group">
            <label for="documents">Upload Documents or Video (Optional):</label>
            <input type="file" id="documents" accept="image/*,video/*">
        </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="nav-btns">
        <button id="prevBtn" class="disabled" onclick="prevStep()">Previous</button>
        <button id="nextBtn" onclick="nextStep()">Next</button>
    </div>

    <!-- Thank You Message -->
    <div class="thank-you-message" id="thankYouMessage">
        <div class="icon">🎉</div>
        <h3>Thank You!</h3>
        <p>Your fundraiser has been successfully created. Together, we can make a difference!</p>
        <button onclick="redirectToIndex()">Close</button>
    </div>
</div>

<script>
    let currentStep = 1;

    function updateSteps() {
        // Update step indicators
        for (let i = 1; i <= 3; i++) {
            document.getElementById(`step${i}`).classList.toggle('active', i === currentStep);
        }

        // Show the correct step content
        for (let i = 1; i <= 3; i++) {
            document.getElementById(`step${i}-content`).classList.toggle('active', i === currentStep);
        }

        // Update navigation buttons
        document.getElementById('prevBtn').classList.toggle('disabled', currentStep === 1);
        document.getElementById('nextBtn').innerText = currentStep === 3 ? 'Submit' : 'Next';
    }

    function prevStep() {
        if (currentStep > 1) {
            currentStep--;
            updateSteps();
        }
    }

    function nextStep() {
        // Validate current step before proceeding
        let isValid = true;

        if (currentStep === 1) {
            const patientName = document.getElementById('patientName').value;
            if (!patientName) {
                isValid = false;
                alert('Please fill the form: Patient Name is required.');
            }
        } else if (currentStep === 2) {
            const title = document.getElementById('title').value;
            const goal = document.getElementById('goal').value;
            const days = document.getElementById('days').value;
            const image = document.getElementById('image').files[0];

            if (!title || !goal || !days || !image) {
                isValid = false;
                alert('Please fill the form: All fields are required.');
            }
        } else if (currentStep === 3) {
            const address = document.getElementById('address').value;
            if (!address) {
                isValid = false;
                alert('Please fill the form: Address is required.');
            }
        }

        // Proceed to the next step if validation passes
        if (isValid) {
            if (currentStep < 3) {
                currentStep++;
                updateSteps();
            } else {
                // Show thank you message on final step
                document.getElementById('thankYouMessage').classList.add('active');
                document.getElementById('step3-content').classList.remove('active');
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('prevBtn').style.display = 'none';
            }
        }
    }

    function redirectToIndex() {
        window.location.href = 'index.html'; // Redirect to index.html
    }

    updateSteps();
</script>

</body>
</html>
