<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareKind Donation</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-image: url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80'); /* Background image */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: rgba(0, 0, 0, 0.7); /* Dark overlay for readability */
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeIn 1.5s ease-in-out;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header h1 {
      font-size: 2.5rem;
      color: #fff;
      margin-bottom: 10px;
      animation: slideIn 1s ease-in-out;
    }

    header p {
      font-size: 1.2rem;
      color: #e0e0e0;
      margin-bottom: 20px;
      animation: slideIn 1.2s ease-in-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .donation-form {
      margin-bottom: 20px;
      animation: fadeIn 1.5s ease-in-out;
    }

    .donation-form h2 {
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 20px;
    }

    .donation-form label {
      display: block;
      font-size: 1rem;
      color: #e0e0e0;
      margin-bottom: 5px;
      text-align: left;
    }

    .donation-form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }

    .donation-form input:focus {
      border-color: #27ae60;
      outline: none;
    }

    .donation-form button {
      width: 100%;
      padding: 12px;
      background-color: #27ae60;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .donation-form button:hover {
      background-color: #219150;
    }

    .progress-bar {
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 20px;
      animation: fadeIn 1.5s ease-in-out;
    }

    .progress {
      width: 0;
      height: 10px;
      background: #27ae60;
      border-radius: 8px;
      transition: width 1s ease-in-out;
    }

    footer {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #e0e0e0;
      animation: fadeIn 1.5s ease-in-out;
    }

    footer a {
      color: #27ae60;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Confetti Animation */
    .confetti-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background-color: #ff0;
      animation: confetti-fall 5s linear infinite;
    }

    @keyframes confetti-fall {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ShareKind Donation</h1>
      <p>Your contribution can make a difference. Help us create change makers in everyone's life.</p>
    </header>

    <section class="donation-form">
      <h2>Make a Donation</h2>
      <form id="donationForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="amount">Donation Amount ($):</label>
        <input type="number" id="amount" name="amount" placeholder="Enter amount" min="1" required>

        <button type="submit">Donate Now</button>
      </form>
    </section>

    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>

    <footer>
      <p>Thank you for your generosity! Together, we can make the world a better place.</p>
      <p>Powered by <a href="#" target="_blank">ShareKind</a></p>
    </footer>
  </div>

  <!-- Confetti Container -->
  <div class="confetti-container" id="confettiContainer"></div>

  <script>
    // JavaScript for form submission, progress bar, and confetti animation
    document.getElementById('donationForm').addEventListener('submit', function (event) {
      event.preventDefault(); // Prevent form submission

      // Get form values
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const amount = parseFloat(document.getElementById('amount').value);

      // Validate inputs
      if (name && email && amount) {
        // Display a thank you message
        alert(`Thank you, ${name}! Your donation of $${amount} has been received. We appreciate your support!`);

        // Update progress bar
        const progressBar = document.getElementById('progress');
        const currentWidth = parseFloat(progressBar.style.width) || 0;
        const newWidth = currentWidth + (amount / 1000) * 100; // Assuming a $1000 goal
        progressBar.style.width = Math.min(newWidth, 100) + '%';

        // Trigger confetti animation
        triggerConfetti();

        // Reset the form
        document.getElementById('donationForm').reset();
      } else {
        alert('Please fill out all fields.');
      }
    });

    // Confetti Animation Function
    function triggerConfetti() {
      const confettiContainer = document.getElementById('confettiContainer');
      confettiContainer.innerHTML = ''; // Clear previous confetti

      for (let i = 0; i < 100; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = `${Math.random() * 100}vw`;
        confetti.style.animationDelay = `${Math.random() * 5}s`;
        confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confettiContainer.appendChild(confetti);
      }

      // Remove confetti after 5 seconds
      setTimeout(() => {
        confettiContainer.innerHTML = '';
      }, 5000);
    }
  </script>
</body>
</html>
