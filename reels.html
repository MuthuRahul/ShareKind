<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareKind Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #28a745;
            --secondary-color: #f8f9fa;
            --text-color: #ffffff;
            --border-color: #dbdbdb;
            --like-color: #ed4956;
            --comment-bg: #f0f2f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: var(--text-color);
            line-height: 1.5;
            height: 100vh;
            overflow: hidden;
            touch-action: pan-y;
        }

        .reels-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .reel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            background: #000;
        }

        .reel.active {
            display: flex;
        }

        .reel video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .reel-header {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            z-index: 3;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 10px;
            border: 2px solid var(--primary-color);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-weight: 600;
            font-size: 14px;
        }

        .follow-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            margin-left: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .reel-actions {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
        }

        .action-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-count {
            font-size: 12px;
            margin-top: 5px;
            font-weight: 600;
        }

        .liked {
            color: var(--like-color);
            animation: heartBeat 0.5s;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
            75% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .reel-description {
            position: relative;
            padding: 15px;
            z-index: 2;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
        }

        .description-text {
            font-size: 14px;
            margin-bottom: 10px;
            max-height: 60px;
            overflow: hidden;
            transition: max-height 0.3s;
        }

        .description-text.expanded {
            max-height: 200px;
        }

        .read-more {
            color: var(--primary-color);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .sound-control {
            position: absolute;
            right: 15px;
            top: 15px;
            z-index: 3;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .sound-control i {
            color: white;
            font-size: 16px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: rgba(0,0,0,0.8);
            z-index: 10;
        }

        .nav-icon {
            color: white;
            font-size: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .nav-icon.active {
            color: var(--primary-color);
        }

        .nav-icon span {
            font-size: 10px;
            margin-top: 3px;
        }

        .nav-profile-img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            z-index: 5;
        }

        .no-reels {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 5;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.3);
            z-index: 3;
        }

        .progress {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Network status indicator */
        .network-status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            animation: slideDown 0.3s ease-out;
        }

        .network-status.online {
            background-color: var(--primary-color);
        }

        .network-status.offline {
            background-color: #ff6b6b;
        }

        @keyframes slideDown {
            from {
                top: -50px;
                opacity: 0;
            }
            to {
                top: 20px;
                opacity: 1;
            }
        }

        /* Upload progress indicator */
        .upload-progress-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 100;
            width: 80%;
            max-width: 300px;
        }

        .upload-progress-container p {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .upload-progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .upload-progress {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="reels-container" id="reelsContainer">
        <div class="loading" id="loadingIndicator">Loading reels...</div>
        <div class="no-reels" id="noReels" style="display: none;">
            <p>No reels found</p>
            <p>Upload videos from your profile</p>
        </div>
        <!-- Reels will be inserted here dynamically -->
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-icon" title="Home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="reels.html" class="nav-icon active" title="Reels">
            <i class="fas fa-play"></i>
            <span>Reels</span>
        </a>
        <a href="maker.html" class="nav-icon" title="Makers">
            <i class="fas fa-star"></i>
            <span>Makers</span>
        </a>
        <a href="reward.html" class="nav-icon" title="Rewards">
            <i class="fas fa-trophy"></i>
            <span>Rewards</span>
        </a>
        <a href="profile.html" class="nav-icon" title="Profile">
            <img id="bottomNavProfileImage" class="nav-profile-img" src="sk pictures/k6.png" alt="Profile">
            <span>Profile</span>
        </a>
    </div>

    <script>
        // Global database reference
let db;

document.addEventListener('DOMContentLoaded', async function() {
    try {
        // Initialize database (same as profile page)
        db = await initializeDB();
        
        // Load and display reels
        await loadAndDisplayReels();
        
        // Setup event listeners
        setupReelEventListeners();
        
    } catch (error) {
        console.error('Initialization error:', error);
        showAlert('Failed to load reels. Please try again later.');
    }
});

// Database initialization (identical to profile page)
async function initializeDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open('ShareKindDB', 4); // Same version as profile page
        
        request.onupgradeneeded = function(event) {
            const db = event.target.result;
            if (!db.objectStoreNames.contains('posts')) {
                const store = db.createObjectStore('posts', { keyPath: 'id' });
                store.createIndex('type', 'type', { unique: false });
            }
        };
        
        request.onsuccess = function() {
            resolve(request.result);
        };
        
        request.onerror = function(event) {
            reject(event.target.error);
        };
    });
}

// Load and display reels from database
async function loadAndDisplayReels() {
    try {
        showLoading(true);
        
        // Get all posts with type 'reel'
        const reels = await getAllReels();
        
        if (reels.length === 0) {
            showNoReelsMessage();
            return;
        }
        
        displayReels(reels);
        playFirstReel(reels[0]);
        
    } catch (error) {
        console.error('Error loading reels:', error);
        showError('Failed to load reels');
        throw error;
    } finally {
        showLoading(false);
    }
}

// Get all reels from database
async function getAllReels() {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(['posts'], 'readonly');
        const store = transaction.objectStore('posts');
        const index = store.index('type');
        const request = index.getAll('reel'); // Filter by reel type
        
        request.onsuccess = () => {
            const results = request.result || [];
            // Ensure all reels have required properties
            const completeReels = results.map(reel => {
                return {
                    ...reel,
                    views: reel.views || 0,
                    likes: reel.likes || 0,
                    comments: reel.comments || 0
                };
            });
            resolve(completeReels);
        };
        
        request.onerror = () => {
            reject(new Error('Failed to fetch reels'));
        };
    });
}

// Display reels in the UI
function displayReels(reels) {
    const reelsContainer = document.getElementById('reelsContainer');
    reelsContainer.innerHTML = '';
    
    reels.forEach((reel, index) => {
        const reelElement = createReelElement(reel, index === 0);
        reelsContainer.appendChild(reelElement);
    });
}

// Create HTML for a single reel
function createReelElement(reel, isActive) {
    const reelElement = document.createElement('div');
    reelElement.className = `reel ${isActive ? 'active' : ''}`;
    reelElement.dataset.reelId = reel.id;
    
    // Get profile data from localStorage (shared with profile page)
    const profileName = localStorage.getItem('profileName') || 'Anonymous';
    const profileImage = localStorage.getItem('profileImage') || 'sk pictures/k6.png';
    
    // Check if liked (from localStorage)
    const likes = JSON.parse(localStorage.getItem('reelLikes') || {};
    const isLiked = likes[reel.id] || false;
    
    reelElement.innerHTML = `
        <div class="progress-bar">
            <div class="progress" id="progress-${reel.id}"></div>
        </div>
        
        <video id="video-${reel.id}" loop playsinline>
            <source src="${reel.content}" type="video/mp4">
        </video>
        
        <div class="sound-control" data-video-id="${reel.id}">
            <i class="fas fa-volume-mute"></i>
        </div>
        
        <div class="reel-header">
            <div class="profile-pic">
                <img src="${profileImage}" alt="${profileName}">
            </div>
            <div class="profile-name">${profileName}</div>
        </div>
        
        <div class="reel-actions">
            <button class="action-btn like-btn" data-reel-id="${reel.id}">
                <i class="${isLiked ? 'fas liked' : 'far'} fa-heart"></i>
                <span class="action-count">${reel.likes}</span>
            </button>
            
            <button class="action-btn comment-btn" data-reel-id="${reel.id}">
                <i class="far fa-comment"></i>
                <span class="action-count">${reel.comments}</span>
            </button>
        </div>
        
        <div class="reel-description">
            <div class="description-text">
                ${reel.description || 'Making a difference!'}
            </div>
        </div>
    `;
    
    return reelElement;
}

// Play the first reel
function playFirstReel(reel) {
    const video = document.getElementById(`video-${reel.id}`);
    if (!video) return;
    
    // Increment view count
    reel.views++;
    updateReelInDB(reel);
    
    // Try to play with sound (will fall back to muted if needed)
    const playPromise = video.play();
    
    if (playPromise !== undefined) {
        playPromise.catch(() => {
            video.muted = true;
            video.play();
        });
    }
    
    // Setup progress bar
    setupProgressBar(reel.id, video);
}

// Update reel in database (shared with profile page)
async function updateReelInDB(reel) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(['posts'], 'readwrite');
        const store = transaction.objectStore('posts');
        const request = store.put(reel);
        
        request.onsuccess = () => resolve();
        request.onerror = (event) => reject(event.target.error);
    });
}

// Setup progress bar for a reel
function setupProgressBar(reelId, video) {
    const progressBar = document.getElementById(`progress-${reelId}`);
    if (!progressBar) return;
    
    video.addEventListener('timeupdate', () => {
        const progress = (video.currentTime / video.duration) * 100;
        progressBar.style.width = `${progress}%`;
    });
}

// Setup event listeners for reels
function setupReelEventListeners() {
    // Like button click
    document.addEventListener('click', function(e) {
        if (e.target.closest('.like-btn')) {
            const reelId = e.target.closest('.like-btn').dataset.reelId;
            toggleLike(reelId);
        }
    });
    
    // Sound control
    document.addEventListener('click', function(e) {
        if (e.target.closest('.sound-control')) {
            const videoId = e.target.closest('.sound-control').dataset.videoId;
            toggleSound(videoId);
        }
    });
    
    // Swipe navigation
    let touchStartY = 0;
    document.addEventListener('touchstart', (e) => {
        touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });
    
    document.addEventListener('touchend', (e) => {
        const touchEndY = e.changedTouches[0].clientY;
        handleSwipe(touchStartY, touchEndY);
    }, { passive: true });
}

// Toggle like status
function toggleLike(reelId) {
    const likeBtn = document.querySelector(`.like-btn[data-reel-id="${reelId}"] i`);
    const likeCount = document.querySelector(`.like-btn[data-reel-id="${reelId}"] .action-count`);
    
    if (!likeBtn || !likeCount) return;
    
    // Get current likes from localStorage
    const likes = JSON.parse(localStorage.getItem('reelLikes') || {};
    const currentLikes = parseInt(likeCount.textContent);
    
    // Toggle like state
    const isLiked = !likes[reelId];
    likes[reelId] = isLiked;
    
    // Update UI
    if (isLiked) {
        likeBtn.classList.remove('far');
        likeBtn.classList.add('fas', 'liked');
        likeCount.textContent = currentLikes + 1;
    } else {
        likeBtn.classList.remove('fas', 'liked');
        likeBtn.classList.add('far');
        likeCount.textContent = currentLikes - 1;
    }
    
    // Save to localStorage
    localStorage.setItem('reelLikes', JSON.stringify(likes));
    
    // Update in database (optional - could be done in bulk later)
    updateLikeCountInDB(reelId, isLiked ? 1 : -1);
}

// Update like count in database
async function updateLikeCountInDB(reelId, delta) {
    try {
        const transaction = db.transaction(['posts'], 'readwrite');
        const store = transaction.objectStore('posts');
        const request = store.get(parseInt(reelId));
        
        request.onsuccess = () => {
            const reel = request.result;
            if (reel) {
                reel.likes = (reel.likes || 0) + delta;
                store.put(reel);
            }
        };
    } catch (error) {
        console.error('Error updating like count:', error);
    }
}

// Toggle sound
function toggleSound(videoId) {
    const video = document.getElementById(`video-${videoId}`);
    const soundIcon = document.querySelector(`.sound-control[data-video-id="${videoId}"] i`);
    
    if (!video || !soundIcon) return;
    
    video.muted = !video.muted;
    soundIcon.classList.toggle('fa-volume-mute');
    soundIcon.classList.toggle('fa-volume-up');
}

// Handle swipe navigation
function handleSwipe(startY, endY) {
    const swipeThreshold = 50;
    const swipeDistance = startY - endY;
    
    if (swipeDistance > swipeThreshold) {
        showNextReel();
    } else if (swipeDistance < -swipeThreshold) {
        showPreviousReel();
    }
}

// UI Helper functions
function showLoading(show) {
    document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
}

function showNoReelsMessage() {
    document.getElementById('noReels').style.display = 'block';
}

function showError(message) {
    const noReels = document.getElementById('noReels');
    noReels.style.display = 'block';
    noReels.innerHTML = `<p>${message}</p>`;
}
    </script>
</body>
</html>
