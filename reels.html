<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareKind Reels</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #28a745;
            --secondary-color: #f8f9fa;
            --text-color: #ffffff;
            --border-color: #dbdbdb;
            --like-color: #ed4956;
            --comment-bg: #f0f2f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: var(--text-color);
            line-height: 1.5;
            height: 100vh;
            overflow: hidden;
            touch-action: pan-y;
        }

        .reels-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .reel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            background: #000;
        }

        .reel.active {
            display: flex;
        }

        .reel video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .reel-header {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            z-index: 3;
        }

        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            margin-right: 10px;
            border: 2px solid var(--primary-color);
        }

        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-weight: 600;
            font-size: 14px;
        }

        .follow-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            margin-left: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .reel-actions {
            position: absolute;
            right: 15px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
        }

        .action-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            margin-bottom: 15px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .action-count {
            font-size: 12px;
            margin-top: 5px;
            font-weight: 600;
        }

        .liked {
            color: var(--like-color);
            animation: heartBeat 0.5s;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); }
            25% { transform: scale(1.3); }
            50% { transform: scale(1); }
            75% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .reel-description {
            position: relative;
            padding: 15px;
            z-index: 2;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
        }

        .description-text {
            font-size: 14px;
            margin-bottom: 10px;
            max-height: 60px;
            overflow: hidden;
            transition: max-height 0.3s;
        }

        .description-text.expanded {
            max-height: 200px;
        }

        .read-more {
            color: var(--primary-color);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .sound-control {
            position: absolute;
            right: 15px;
            top: 15px;
            z-index: 3;
            background: rgba(0,0,0,0.5);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .sound-control i {
            color: white;
            font-size: 16px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            background: rgba(0,0,0,0.8);
            z-index: 10;
        }

        .nav-icon {
            color: white;
            font-size: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .nav-icon.active {
            color: var(--primary-color);
        }

        .nav-icon span {
            font-size: 10px;
            margin-top: 3px;
        }

        .nav-profile-img {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            z-index: 5;
        }

        .no-reels {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 5;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.3);
            z-index: 3;
        }

        .progress {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Network status indicator */
        .network-status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            animation: slideDown 0.3s ease-out;
        }

        .network-status.online {
            background-color: var(--primary-color);
        }

        .network-status.offline {
            background-color: #ff6b6b;
        }

        @keyframes slideDown {
            from {
                top: -50px;
                opacity: 0;
            }
            to {
                top: 20px;
                opacity: 1;
            }
        }

        /* Upload progress indicator */
        .upload-progress-container {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 100;
            width: 80%;
            max-width: 300px;
        }

        .upload-progress-container p {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .upload-progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .upload-progress {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="reels-container" id="reelsContainer">
        <div class="loading" id="loadingIndicator">Loading reels...</div>
        <div class="no-reels" id="noReels" style="display: none;">
            <p>No reels found</p>
            <p>Upload videos from your profile</p>
        </div>
        <!-- Reels will be inserted here dynamically -->
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-icon" title="Home">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="reels.html" class="nav-icon active" title="Reels">
            <i class="fas fa-play"></i>
            <span>Reels</span>
        </a>
        <a href="maker.html" class="nav-icon" title="Makers">
            <i class="fas fa-star"></i>
            <span>Makers</span>
        </a>
        <a href="reward.html" class="nav-icon" title="Rewards">
            <i class="fas fa-trophy"></i>
            <span>Rewards</span>
        </a>
        <a href="profile.html" class="nav-icon" title="Profile">
            <img id="bottomNavProfileImage" class="nav-profile-img" src="sk pictures/k6.png" alt="Profile">
            <span>Profile</span>
        </a>
    </div>

    <script>
        // Main application class
        class ReelsApp {
            constructor() {
                this.reelsContainer = document.getElementById('reelsContainer');
                this.loadingIndicator = document.getElementById('loadingIndicator');
                this.noReels = document.getElementById('noReels');
                this.bottomNavProfileImage = document.getElementById('bottomNavProfileImage');
                
                this.currentReelIndex = 0;
                this.reels = [];
                this.likes = {};
                this.comments = {};
                this.isMuted = true;
                this.db = null;
                
                this.init();
            }
            
            async init() {
                try {
                    // Load profile image
                    this.loadProfileImage();
                    
                    // Load likes and comments from localStorage
                    this.loadLocalData();
                    
                    // Initialize database
                    this.db = await this.openDatabase();
                    
                    // Load reels from IndexedDB
                    await this.loadReels();
                    
                    // Set up event listeners
                    this.setupEventListeners();
                    
                    // Set up network detection
                    this.setupNetworkDetection();
                    
                } catch (error) {
                    console.error('Initialization error:', error);
                    this.showError('Failed to load reels. Please try again later.');
                }
            }
            
            loadProfileImage() {
                const savedImage = localStorage.getItem('profileImage');
                if (savedImage && this.bottomNavProfileImage) {
                    this.bottomNavProfileImage.src = savedImage;
                }
            }
            
            loadLocalData() {
                // Load likes
                const savedLikes = localStorage.getItem('reelLikes');
                if (savedLikes) {
                    this.likes = JSON.parse(savedLikes);
                }
                
                // Load comments
                const savedComments = localStorage.getItem('reelComments');
                if (savedComments) {
                    this.comments = JSON.parse(savedComments);
                }
            }
            
            saveLocalData() {
                localStorage.setItem('reelLikes', JSON.stringify(this.likes));
                localStorage.setItem('reelComments', JSON.stringify(this.comments));
            }
            
            openDatabase() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('ShareKindDB', 4);
                    
                    request.onerror = (event) => {
                        reject(new Error(`Database error: ${event.target.error}`));
                    };
                    
                    request.onsuccess = (event) => {
                        resolve(event.target.result);
                    };
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('posts')) {
                            const store = db.createObjectStore('posts', { keyPath: 'id' });
                            store.createIndex('type', 'type', { unique: false });
                        }
                    };
                });
            }
            
            async loadReels() {
                try {
                    this.loadingIndicator.style.display = 'block';
                    this.noReels.style.display = 'none';
                    
                    // Get all reels (posts with type 'reel')
                    this.reels = await this.getAllReels();
                    
                    if (this.reels.length === 0) {
                        this.loadingIndicator.style.display = 'none';
                        this.noReels.style.display = 'block';
                        return;
                    }
                    
                    // Display reels
                    this.displayReels();
                    
                    // Play the first reel
                    this.playCurrentReel();
                    
                    this.loadingIndicator.style.display = 'none';
                    
                } catch (error) {
                    console.error('Error loading reels:', error);
                    this.loadingIndicator.style.display = 'none';
                    this.showError('Failed to load reels. Please try again.');
                    throw error;
                }
            }
            
            getAllReels() {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['posts'], 'readonly');
                    const store = transaction.objectStore('posts');
                    const index = store.index('type');
                    const request = index.getAll('reel');
                    
                    request.onerror = () => {
                        reject(new Error('Error fetching reels'));
                    };
                    
                    request.onsuccess = () => {
                        // Initialize view counts if they don't exist
                        const reels = request.result.map(reel => {
                            if (!reel.views) {
                                reel.views = 0;
                            }
                            if (!reel.likes) {
                                reel.likes = 0;
                            }
                            if (!reel.comments) {
                                reel.comments = 0;
                            }
                            return reel;
                        });
                        resolve(reels || []);
                    };
                });
            }
            
            displayReels() {
                this.reelsContainer.innerHTML = '';
                
                this.reels.forEach((reel, index) => {
                    const reelElement = document.createElement('div');
                    reelElement.className = 'reel';
                    reelElement.dataset.reelId = reel.id;
                    
                    if (index === 0) {
                        reelElement.classList.add('active');
                    }
                    
                    // Get profile data
                    const profileName = localStorage.getItem('profileName') || 'Anonymous';
                    const profileImage = localStorage.getItem('profileImage') || 'sk pictures/k6.png';
                    
                    // Check if liked
                    const isLiked = this.likes[reel.id] || false;
                    
                    // Create reel HTML
                    reelElement.innerHTML = `
                        <div class="progress-bar">
                            <div class="progress" id="progress-${reel.id}"></div>
                        </div>
                        
                        <video id="video-${reel.id}" loop playsinline>
                            <source src="${reel.content}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        
                        <div class="sound-control" data-video-id="${reel.id}">
                            <i class="fas fa-volume-mute"></i>
                        </div>
                        
                        <div class="reel-header">
                            <div class="profile-pic">
                                <img src="${profileImage}" alt="${profileName}">
                            </div>
                            <div class="profile-name">${profileName}</div>
                            <button class="follow-btn">Follow</button>
                        </div>
                        
                        <div class="reel-actions">
                            <button class="action-btn like-btn" data-reel-id="${reel.id}">
                                <i class="${isLiked ? 'fas liked' : 'far'} fa-heart"></i>
                                <span class="action-count">${reel.likes}</span>
                            </button>
                            
                            <button class="action-btn comment-btn" data-reel-id="${reel.id}">
                                <i class="far fa-comment"></i>
                                <span class="action-count">${reel.comments}</span>
                            </button>
                            
                            <button class="action-btn share-btn" data-reel-id="${reel.id}">
                                <i class="fas fa-share"></i>
                                <span class="action-count">Share</span>
                            </button>
                        </div>
                        
                        <div class="reel-description">
                            <div class="description-text">
                                ${reel.description || 'Making a difference in my community!'}
                            </div>
                            <div class="read-more">Read more</div>
                        </div>
                    `;
                    
                    this.reelsContainer.appendChild(reelElement);
                });
            }
            
            setupEventListeners() {
                // Like button click
                document.addEventListener('click', (e) => {
                    if (e.target.closest('.like-btn')) {
                        const reelId = e.target.closest('.like-btn').dataset.reelId;
                        this.toggleLike(reelId);
                    }
                });
                
                // Double tap to like
                document.addEventListener('dblclick', (e) => {
                    if (e.target.closest('.reel')) {
                        const reelId = e.target.closest('.reel').dataset.reelId;
                        this.toggleLike(reelId);
                    }
                });
                
                // Sound control
                document.addEventListener('click', (e) => {
                    if (e.target.closest('.sound-control')) {
                        const videoId = e.target.closest('.sound-control').dataset.videoId;
                        this.toggleSound(videoId);
                    }
                });
                
                // Read more/less
                document.addEventListener('click', (e) => {
                    if (e.target.classList.contains('read-more')) {
                        const description = e.target.previousElementSibling;
                        description.classList.toggle('expanded');
                        e.target.textContent = description.classList.contains('expanded') ? 'Read less' : 'Read more';
                    }
                });
                
                // Swipe navigation
                let touchStartY = 0;
                let touchEndY = 0;
                
                document.addEventListener('touchstart', (e) => {
                    touchStartY = e.changedTouches[0].clientY;
                }, { passive: true });
                
                document.addEventListener('touchend', (e) => {
                    touchEndY = e.changedTouches[0].clientY;
                    this.handleSwipe(touchStartY, touchEndY);
                }, { passive: true });
                
                // Keyboard navigation
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowUp') {
                        this.previousReel();
                    } else if (e.key === 'ArrowDown') {
                        this.nextReel();
                    } else if (e.key === ' ') {
                        this.togglePlayPause();
                    }
                });
            }
            
            setupNetworkDetection() {
                window.addEventListener('online', () => this.updateOnlineStatus(true));
                window.addEventListener('offline', () => this.updateOnlineStatus(false));
                this.updateOnlineStatus(navigator.onLine);
            }
            
            updateOnlineStatus(isOnline) {
                // Remove existing status if any
                const existingStatus = document.querySelector('.network-status');
                if (existingStatus) existingStatus.remove();
                
                if (isOnline === undefined) return;
                
                const status = isOnline ? 'online' : 'offline';
                const statusElement = document.createElement('div');
                statusElement.className = `network-status ${status}`;
                statusElement.textContent = isOnline ? 'Back online' : 'No internet connection';
                
                document.body.appendChild(statusElement);
                
                setTimeout(() => {
                    statusElement.remove();
                }, 3000);
            }
            
            handleSwipe(startY, endY) {
                const swipeThreshold = 50;
                const swipeDistance = startY - endY;
                
                if (swipeDistance > swipeThreshold) {
                    this.nextReel();
                } else if (swipeDistance < -swipeThreshold) {
                    this.previousReel();
                }
            }
            
            playCurrentReel() {
                if (this.reels.length === 0) return;
                
                const currentReel = this.reels[this.currentReelIndex];
                const video = document.getElementById(`video-${currentReel.id}`);
                
                if (video) {
                    // Increment view count
                    currentReel.views++;
                    this.updateReelInDB(currentReel);
                    
                    // Try to play with sound
                    const playPromise = video.play();
                    
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            // If autoplay fails, mute and try again
                            video.muted = true;
                            this.isMuted = true;
                            video.play();
                            this.updateSoundIcon(video.id);
                        });
                    }
                    
                    this.updateProgressBar(currentReel.id, video);
                }
            }
            
            updateProgressBar(reelId, video) {
                const progressBar = document.getElementById(`progress-${reelId}`);
                
                if (!progressBar) return;
                
                const updateProgress = () => {
                    const progress = (video.currentTime / video.duration) * 100;
                    progressBar.style.width = `${progress}%`;
                };
                
                const handleVideoEnd = () => {
                    progressBar.style.width = '100%';
                    video.removeEventListener('timeupdate', updateProgress);
                    video.removeEventListener('ended', handleVideoEnd);
                };
                
                video.addEventListener('timeupdate', updateProgress);
                video.addEventListener('ended', handleVideoEnd);
            }
            
            toggleLike(reelId) {
                if (!reelId) return;
                
                const reel = this.reels.find(r => r.id == reelId);
                if (!reel) return;
                
                const likeBtn = document.querySelector(`.like-btn[data-reel-id="${reelId}"] i`);
                const likeCount = document.querySelector(`.like-btn[data-reel-id="${reelId}"] .action-count`);
                
                if (!likeBtn || !likeCount) return;
                
                // Toggle like state
                this.likes[reelId] = !this.likes[reelId];
                
                // Update reel data
                if (this.likes[reelId]) {
                    reel.likes++;
                } else {
                    reel.likes--;
                }
                
                // Update database
                this.updateReelInDB(reel);
                
                // Update UI
                if (this.likes[reelId]) {
                    likeBtn.classList.remove('far');
                    likeBtn.classList.add('fas', 'liked');
                    likeCount.textContent = reel.likes;
                } else {
                    likeBtn.classList.remove('fas', 'liked');
                    likeBtn.classList.add('far');
                    likeCount.textContent = reel.likes;
                }
                
                // Save to localStorage
                this.saveLocalData();
            }
            
            toggleSound(videoId) {
                const video = document.getElementById(`video-${videoId}`);
                const soundIcon = document.querySelector(`.sound-control[data-video-id="${videoId}"] i`);
                
                if (!video || !soundIcon) return;
                
                this.isMuted = !this.isMuted;
                video.muted = this.isMuted;
                
                soundIcon.classList.toggle('fa-volume-mute');
                soundIcon.classList.toggle('fa-volume-up');
            }
            
            updateSoundIcon(videoId) {
                const soundIcon = document.querySelector(`.sound-control[data-video-id="${videoId}"] i`);
                if (!soundIcon) return;
                
                soundIcon.className = this.isMuted ? 'fas fa-volume-mute' : 'fas fa-volume-up';
            }
            
            togglePlayPause() {
                if (this.reels.length === 0) return;
                
                const currentReel = this.reels[this.currentReelIndex];
                const video = document.getElementById(`video-${currentReel.id}`);
                
                if (!video) return;
                
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
            
            nextReel() {
                if (this.reels.length === 0) return;
                
                // Pause current reel
                const currentReel = this.reels[this.currentReelIndex];
                const currentVideo = document.getElementById(`video-${currentReel.id}`);
                if (currentVideo) {
                    currentVideo.pause();
                    currentVideo.currentTime = 0;
                }
                
                // Hide current reel
                const currentReelElement = document.querySelector(`.reel[data-reel-id="${currentReel.id}"]`);
                if (currentReelElement) {
                    currentReelElement.classList.remove('active');
                }
                
                // Move to next reel
                this.currentReelIndex = (this.currentReelIndex + 1) % this.reels.length;
                
                // Show and play next reel
                const nextReel = this.reels[this.currentReelIndex];
                const nextReelElement = document.querySelector(`.reel[data-reel-id="${nextReel.id}"]`);
                const nextVideo = document.getElementById(`video-${nextReel.id}`);
                
                if (nextReelElement && nextVideo) {
                    nextReelElement.classList.add('active');
                    nextVideo.play().catch(e => console.log('Autoplay prevented:', e));
                    this.updateProgressBar(nextReel.id, nextVideo);
                }
            }
            
            previousReel() {
                if (this.reels.length === 0) return;
                
                // Pause current reel
                const currentReel = this.reels[this.currentReelIndex];
                const currentVideo = document.getElementById(`video-${currentReel.id}`);
                if (currentVideo) {
                    currentVideo.pause();
                    currentVideo.currentTime = 0;
                }
                
                // Hide current reel
                const currentReelElement = document.querySelector(`.reel[data-reel-id="${currentReel.id}"]`);
                if (currentReelElement) {
                    currentReelElement.classList.remove('active');
                }
                
                // Move to previous reel
                this.currentReelIndex = (this.currentReelIndex - 1 + this.reels.length) % this.reels.length;
                
                // Show and play previous reel
                const prevReel = this.reels[this.currentReelIndex];
                const prevReelElement = document.querySelector(`.reel[data-reel-id="${prevReel.id}"]`);
                const prevVideo = document.getElementById(`video-${prevReel.id}`);
                
                if (prevReelElement && prevVideo) {
                    prevReelElement.classList.add('active');
                    prevVideo.play().catch(e => console.log('Autoplay prevented:', e));
                    this.updateProgressBar(prevReel.id, prevVideo);
                }
            }
            
            async updateReelInDB(reel) {
                return new Promise((resolve, reject) => {
                    const transaction = this.db.transaction(['posts'], 'readwrite');
                    const store = transaction.objectStore('posts');
                    const request = store.put(reel);
                    
                    request.onsuccess = () => resolve();
                    request.onerror = (event) => reject(event.target.error);
                });
            }
            
            showError(message) {
                this.loadingIndicator.style.display = 'none';
                this.noReels.style.display = 'block';
                this.noReels.innerHTML = `
                    <p>${message}</p>
                    <button onclick="window.location.reload()" style="
                        background: var(--primary-color);
                        color: white;
                        border: none;
                        padding: 8px 16px;
                        border-radius: 4px;
                        margin-top: 10px;
                        cursor: pointer;
                    ">Try Again</button>
                `;
            }
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new ReelsApp();
        });
    </script>
</body>
</html>
